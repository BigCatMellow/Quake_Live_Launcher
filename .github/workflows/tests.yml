name: tests

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  repair-live-runtime:
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, 'fix: live gameplay lifecycle') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply live-runtime repairs and regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('solo_engine/plugins/solo_arcade.py')
          text = path.read_text(encoding='utf-8')

          old = '''            "bot_enable": "1", "bot_thinktime": "0", "bot_challenge": "1",
            "bot_minplayers": "0", "fraglimit": "0", "timelimit": "0",
'''
          new = '''            "bot_enable": "1", "bot_thinktime": "0", "bot_challenge": "1",
            "bot_aasoptimize": "1", "bot_rocketjump": "1", "bot_nochat": "1",
            "bot_dynamicskill": "0", "bot_minplayers": "0",
            "fraglimit": "0", "timelimit": "0",
'''
          assert text.count(old) == 1, 'bot cvar block changed unexpectedly'
          text = text.replace(old, new)

          old = '''    def _handle_human_death(self, victim):
        if self.controller.phase in (Phase.COMPLETE, Phase.FAILED):
            return
        self.player_deaths += 1
'''
          new = '''    def _handle_human_death(self, victim):
        if self.controller.phase in (Phase.COMPLETE, Phase.FAILED):
            return
        # Quake Live can emit a death while the joining client is moved onto
        # RED or while a new objective/map is still PREPARING. That transition
        # is not a gameplay loss; deaths only count once the objective is live.
        if self.controller.phase != Phase.ACTIVE:
            self._log(f"ignored pre-active human death phase={self.controller.phase.value}")
            return
        self.player_deaths += 1
'''
          assert text.count(old) == 1, 'human death block changed unexpectedly'
          text = text.replace(old, new)

          old = '''    def _apply_bot_loadout(self, player):
        plan = self.current_plan or {}
        try:
            if self.mode in ("arena_run", "boss_rush", "gauntlet_run") and plan:
                player.health = int(plan.get("health", 100))
                player.armor = int(plan.get("armor", 0))
                trial = {"rocket": 5, "lg": 6, "rail": 7, "plasma": 8}.get(plan.get("theme"))
                if trial: self._give_single_weapon(player, trial)
                elif plan.get("boss"): self._give_single_weapon(player, 5)
        except Exception as exc:
            self._log(f"bot loadout failed: {exc}")
'''
          new = '''    def _apply_bot_loadout(self, player):
        plan = self.current_plan or {}
        try:
            # Scripted servers disable map weapon/ammo pickups. Give every bot
            # a combat-ready loadout so its AI can immediately hunt the human
            # instead of spending the opening of a wave searching for gear.
            player.health = int(plan.get("health", 100)) if plan else 100
            player.armor = int(plan.get("armor", 25)) if plan else 25
            player.weapons(
                reset=True,
                g=True, mg=True, sg=True, gl=True,
                rl=True, lg=True, rg=True, pg=True,
            )
            player.ammo(
                reset=True,
                mg=160, sg=40, gl=30, rl=40,
                lg=120, rg=25, pg=120,
            )

            if self.mode in ("arena_run", "boss_rush", "gauntlet_run") and plan:
                trial = {"rocket": 5, "lg": 6, "rail": 7, "plasma": 8}.get(plan.get("theme"))
                if trial:
                    self._give_single_weapon(player, trial)
                elif plan.get("boss"):
                    self._give_single_weapon(player, 5)
        except Exception as exc:
            self._log(f"bot loadout failed: {exc}")
'''
          assert text.count(old) == 1, 'bot loadout block changed unexpectedly'
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          Path('tests/test_live_runtime_regressions.py').write_text('''from __future__ import annotations

import unittest

from tests.test_v5_runtime import RuntimeHarness


class LiveRuntimeRegressions(unittest.TestCase):
    def setUp(self):
        self.harness = RuntimeHarness(methodName="runTest")
        self.harness.setUp()

    def tearDown(self):
        self.harness.tearDown()

    def reset_harness(self):
        self.harness.tearDown()
        self.harness = RuntimeHarness(methodName="runTest")
        self.harness.setUp()

    def test_startup_human_death_does_not_end_fatal_modes_before_active(self):
        modes = (
            "horde", "boss_rush", "wipeout_solo", "gauntlet_run",
            "last_stand", "one_life", "movement_hunter", "predator",
        )
        for index, mode in enumerate(modes):
            with self.subTest(mode=mode):
                if index:
                    self.reset_harness()
                server, plugin, human = self.harness.boot(mode)
                self.assertEqual(plugin.controller.phase.value, "preparing")
                before = plugin.player_deaths
                server.death(human, None)
                self.assertNotEqual(plugin.controller.phase.value, "complete")
                self.assertEqual(plugin.controller.phase.value, "preparing")
                self.assertEqual(plugin.player_deaths, before)

    def test_horde_bots_receive_combat_loadout_and_aggressive_cvars(self):
        server, plugin, human = self.harness.boot("horde")
        self.harness.spawn_initial(server)
        bots = self.harness.active_bots(server, plugin)
        self.assertTrue(bots)
        bot = bots[0]
        self.assertTrue(bot._weapons.get("rl"))
        self.assertTrue(bot._weapons.get("lg"))
        self.assertTrue(bot._weapons.get("rg"))
        self.assertGreater(bot._ammo.rl, 0)
        self.assertGreater(bot._ammo.lg, 0)
        self.assertEqual(server.cvars.get("bot_dynamicskill"), "0")
        self.assertEqual(server.cvars.get("bot_aasoptimize"), "1")
        self.assertEqual(server.cvars.get("bot_rocketjump"), "1")


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')
          PY

      - name: Commit repaired runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solo_engine/plugins/solo_arcade.py tests/test_live_runtime_regressions.py
          git diff --cached --check
          git commit -m "fix: live gameplay lifecycle and bot combat readiness"
          git push origin HEAD:v5-alpha

  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python
        run: |
          python -m py_compile launcher.py launcher_gui.py solo_engine/sync_maps.py
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          for stem in ('launcher_impl.py.gz','launcher_gui_impl.py.gz'):
              parts=sorted(Path('.').glob(stem+'.b64part*'))
              assert parts, stem
              raw=base64.b64decode(''.join(p.read_text().strip() for p in parts))
              compile(gzip.decompress(raw), stem[:-3], 'exec')
              print('OK payload', stem, len(parts), 'parts')
          PY
          python -m py_compile solo_engine/plugins/*.py solo_engine/plugins/modes/*.py
          python -m py_compile tests/*.py

      - name: Unit and fake-minqlx integration tests
        run: python -m unittest discover -s tests -v

      - name: Validate shell scripts and executable modes
        run: |
          bash -n install.sh uninstall.sh run.sh
          for file in solo_engine/*.sh; do bash -n "$file"; done
          for file in install.sh uninstall.sh run.sh solo_engine/*.sh solo_engine/sync_maps.py; do
            test -x "$file" || { echo "required executable bit missing: $file"; exit 1; }
          done

      - name: Validate resource JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('resources').glob('*.json'):
              json.loads(path.read_text())
              print('OK', path)
          PY

      - name: Disposable HOME install/import/uninstall smoke
        run: |
          set -euo pipefail
          TEMP_HOME="$(mktemp -d)"
          HOME="$TEMP_HOME" bash install.sh
          test -x "$TEMP_HOME/.local/bin/quake-live-launcher"
          test -x "$TEMP_HOME/.local/share/quake-live-launcher/solo_engine/self_test.sh"
          test -f "$TEMP_HOME/.local/share/quake-live-launcher/solo_engine/plugins/solo_controller.py"
          test -f "$TEMP_HOME/.local/share/quake-live-launcher/solo_engine/plugins/modes/horde.py"
          HOME="$TEMP_HOME" python - "$TEMP_HOME" <<'PY'
          import importlib.util,sys
          from pathlib import Path
          home=Path(sys.argv[1])
          path=home/'.local/share/quake-live-launcher/launcher.py'
          spec=importlib.util.spec_from_file_location('qll_installed_launcher',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.APP_VERSION == '5.0-alpha', module.APP_VERSION
          print('installed launcher import OK:', module.APP_VERSION)
          PY
          mkdir -p "$TEMP_HOME/.local/share/quake-live-launcher/solo_runtime"
          echo preserve > "$TEMP_HOME/.local/share/quake-live-launcher/solo_runtime/sentinel"
          HOME="$TEMP_HOME" bash uninstall.sh
          test -f "$TEMP_HOME/.local/share/quake-live-launcher/solo_runtime/sentinel"
          test ! -e "$TEMP_HOME/.local/bin/quake-live-launcher"

      - name: Build install archive
        run: |
          zip -r -q Quake_Live_Launcher_v5-alpha.zip \
            launcher.py launcher_gui.py launcher_impl.py.gz.b64part* launcher_gui_impl.py.gz.b64part* \
            resources solo_engine install.sh uninstall.sh run.sh README.md \
            -x '*/__pycache__/*' '*.pyc'
          unzip -t Quake_Live_Launcher_v5-alpha.zip >/dev/null

      - name: Verify archive equals shipped source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, stat, tempfile, zipfile

          archive = Path('Quake_Live_Launcher_v5-alpha.zip')
          roots = [Path('resources'), Path('solo_engine')]
          expected = {
              Path('launcher.py'), Path('launcher_gui.py'), Path('install.sh'),
              Path('uninstall.sh'), Path('run.sh'), Path('README.md'),
              *Path('.').glob('launcher_impl.py.gz.b64part*'),
              *Path('.').glob('launcher_gui_impl.py.gz.b64part*'),
          }
          for root in roots:
              expected.update(
                  p for p in root.rglob('*')
                  if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc'
              )
          required_executable = {
              Path('install.sh'), Path('uninstall.sh'), Path('run.sh'),
              *Path('solo_engine').glob('*.sh'), Path('solo_engine/sync_maps.py'),
          }

          with tempfile.TemporaryDirectory() as td:
              dest = Path(td)
              with zipfile.ZipFile(archive) as zf:
                  names = {Path(name) for name in zf.namelist() if not name.endswith('/')}
                  assert not any('__pycache__' in p.parts or p.suffix == '.pyc' for p in names), names
                  assert names == expected, f'archive file set differs: missing={expected-names}, extra={names-expected}'
                  for rel in sorted(required_executable):
                      mode = (zf.getinfo(str(rel)).external_attr >> 16) & 0o777
                      assert mode & 0o111, f'archive executable bit missing: {rel} mode={oct(mode)}'
                  zf.extractall(dest)
              for rel in sorted(expected):
                  a = hashlib.sha256(rel.read_bytes()).digest()
                  b = hashlib.sha256((dest / rel).read_bytes()).digest()
                  assert a == b, f'archive byte mismatch: {rel}'
          print('archive/source equality + executable modes OK:', len(expected), 'files')
          PY

      - name: Upload install archive
        uses: actions/upload-artifact@v4
        with:
          name: Quake_Live_Launcher_v5-alpha
          path: Quake_Live_Launcher_v5-alpha.zip
          if-no-files-found: error
