name: source-sync

on:
  push:
    branches: [v5-alpha]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified source payload
        run: |
          set -euo pipefail
          cat .sync/payload.b64.part* | base64 -d > /tmp/qll_source_sync.tar.xz
          echo '620fef70f244b4921eb5c22695e481dacd7af1c83d2a2e978bf274520ae3e397  /tmp/qll_source_sync.tar.xz' | sha256sum -c -
          tar -xJf /tmp/qll_source_sync.tar.xz -C .
          rm -rf .sync
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && { echo 'No sync changes found'; exit 0; }
          git commit -m 'sync: align branch with verified source candidate'
          git push origin HEAD:v5-alpha
