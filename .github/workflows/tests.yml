name: tests

on:
  push:
  pull_request:

jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python
        run: |
          python -m py_compile launcher.py launcher_gui.py solo_engine/sync_maps.py
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          for stem in ('launcher_impl.py.gz','launcher_gui_impl.py.gz'):
              parts=sorted(Path('.').glob(stem+'.b64part*'))
              assert parts, stem
              raw=base64.b64decode(''.join(p.read_text().strip() for p in parts))
              compile(gzip.decompress(raw), stem[:-3], 'exec')
              print('OK payload', stem, len(parts), 'parts')
          PY
          python -m py_compile solo_engine/plugins/*.py solo_engine/plugins/modes/*.py
          python -m py_compile tests/*.py

      - name: Unit and fake-minqlx integration tests
        run: python -m unittest discover -s tests -v

      - name: Validate shell scripts
        run: |
          bash -n install.sh uninstall.sh run.sh
          for file in solo_engine/*.sh; do bash -n "$file"; done

      - name: Validate resource JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('resources').glob('*.json'):
              json.loads(path.read_text())
              print('OK', path)
          PY

      - name: Disposable HOME install/import/uninstall smoke
        run: |
          set -euo pipefail
          TEMP_HOME="$(mktemp -d)"
          HOME="$TEMP_HOME" bash install.sh
          test -x "$TEMP_HOME/.local/bin/quake-live-launcher"
          test -x "$TEMP_HOME/.local/share/quake-live-launcher/solo_engine/self_test.sh"
          test -f "$TEMP_HOME/.local/share/quake-live-launcher/solo_engine/plugins/solo_controller.py"
          test -f "$TEMP_HOME/.local/share/quake-live-launcher/solo_engine/plugins/modes/horde.py"
          HOME="$TEMP_HOME" python - "$TEMP_HOME" <<'PY'
          import importlib.util,sys
          from pathlib import Path
          home=Path(sys.argv[1])
          path=home/'.local/share/quake-live-launcher/launcher.py'
          spec=importlib.util.spec_from_file_location('qll_installed_launcher',path)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.APP_VERSION == '5.0-alpha', module.APP_VERSION
          print('installed launcher import OK:', module.APP_VERSION)
          PY
          mkdir -p "$TEMP_HOME/.local/share/quake-live-launcher/solo_runtime"
          echo preserve > "$TEMP_HOME/.local/share/quake-live-launcher/solo_runtime/sentinel"
          HOME="$TEMP_HOME" bash uninstall.sh
          test -f "$TEMP_HOME/.local/share/quake-live-launcher/solo_runtime/sentinel"
          test ! -e "$TEMP_HOME/.local/bin/quake-live-launcher"

      - name: Build install archive
        run: |
          zip -r -q Quake_Live_Launcher_v5-alpha.zip \
            launcher.py launcher_gui.py launcher_impl.py.gz.b64part* launcher_gui_impl.py.gz.b64part* \
            resources solo_engine install.sh uninstall.sh run.sh README.md \
            -x '*/__pycache__/*' '*.pyc'
          unzip -t Quake_Live_Launcher_v5-alpha.zip >/dev/null

      - name: Verify archive equals shipped source
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, tempfile, zipfile

          archive = Path('Quake_Live_Launcher_v5-alpha.zip')
          roots = [Path('resources'), Path('solo_engine')]
          expected = {
              Path('launcher.py'), Path('launcher_gui.py'), Path('install.sh'),
              Path('uninstall.sh'), Path('run.sh'), Path('README.md'),
              *Path('.').glob('launcher_impl.py.gz.b64part*'),
              *Path('.').glob('launcher_gui_impl.py.gz.b64part*'),
          }
          for root in roots:
              expected.update(
                  p for p in root.rglob('*')
                  if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc'
              )

          with tempfile.TemporaryDirectory() as td:
              dest = Path(td)
              with zipfile.ZipFile(archive) as zf:
                  names = {Path(name) for name in zf.namelist() if not name.endswith('/')}
                  assert not any('__pycache__' in p.parts or p.suffix == '.pyc' for p in names), names
                  assert names == expected, f'archive file set differs: missing={expected-names}, extra={names-expected}'
                  zf.extractall(dest)
              for rel in sorted(expected):
                  a = hashlib.sha256(rel.read_bytes()).digest()
                  b = hashlib.sha256((dest / rel).read_bytes()).digest()
                  assert a == b, f'archive byte mismatch: {rel}'
          print('archive/source equality OK:', len(expected), 'files')
          PY

      - name: Upload install archive
        uses: actions/upload-artifact@v4
        with:
          name: Quake_Live_Launcher_v5-alpha
          path: Quake_Live_Launcher_v5-alpha.zip
          if-no-files-found: error
