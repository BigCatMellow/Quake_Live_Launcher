name: apply director integration

on:
  push:
    branches: [v5-alpha]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integration
        run: python tools/apply_director_integration.py
      - name: Verify integration
        run: |
          python -m py_compile solo_engine/plugins/*.py
          python -m unittest tests.test_director tests.test_live_runtime_regressions tests.test_v5_runtime -v
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solo_engine/plugins/solo_arcade.py
          git diff --cached --check
          git commit -m "feat: integrate encounter director into solo runtime"
          git push origin HEAD:v5-alpha
