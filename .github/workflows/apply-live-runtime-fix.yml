name: apply live runtime fix

on:
  push:
    branches: [v5-alpha]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'fix: live gameplay lifecycle') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply live-runtime repairs and regression tests
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          decode = lambda value: base64.b64decode(value).decode('utf-8')
          path = Path('solo_engine/plugins/solo_arcade.py')
          text = path.read_text(encoding='utf-8')
          patches = [
              ('cvars', 'ICAgICAgICAgICAgImJvdF9lbmFibGUiOiAiMSIsICJib3RfdGhpbmt0aW1lIjogIjAiLCAiYm90X2NoYWxsZW5nZSI6ICIxIiwKICAgICAgICAgICAgImJvdF9taW5wbGF5ZXJzIjogIjAiLCAiZnJhZ2xpbWl0IjogIjAiLCAidGltZWxpbWl0IjogIjAiLAo=', ''),
              ('death', 'ICAgIGRlZiBfaGFuZGxlX2h1bWFuX2RlYXRoKHNlbGYsIHZpY3RpbSk6CiAgICAgICAgaWYgc2VsZi5jb250cm9sbGVyLnBoYXNlIGluIChQaGFzZS5DT01QTEVURSwgUGhhc2UuRkFJTEVEKToKICAgICAgICAgICAgcmV0dXJuCiAgICAgICAgc2VsZi5wbGF5ZXJfZGVhdGhzICs9IDEK', ''),
              ('loadout', '', ''),
          ]
          for label, old_b64, new_b64 in patches:
              old = decode(old_b64)
              new = decode(new_b64)
              assert text.count(old) == 1, f'{label} block changed unexpectedly'
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          test_b64 = ''
          Path('tests/test_live_runtime_regressions.py').write_bytes(base64.b64decode(test_b64))
          PY

      - name: Commit repaired runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add solo_engine/plugins/solo_arcade.py tests/test_live_runtime_regressions.py
          git diff --cached --check
          git commit -m "fix: live gameplay lifecycle and bot combat readiness"
          git push origin HEAD:v5-alpha
