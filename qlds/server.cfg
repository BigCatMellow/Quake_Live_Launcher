// Quake Live Launcher v5 Solo Engine
// ZMQ stats must be enabled on the qzeroded command line BEFORE plugins load.
set sv_hostname "Quake Live // Solo Engine v5"
set sv_maxClients "16"
set sv_privateClients "0"
set sv_pure "0"
set g_password ""

set bot_enable "1"
set bot_thinktime "0"
set bot_challenge "1"
set bot_minplayers "0"

set g_doWarmup "0"
set g_warmup "0"
set sv_warmupReadyPercentage "0"
set g_warmupDelay "0"
set fraglimit "0"
set timelimit "0"

set qlx_plugins "solo_arcade"
set qlx_commandPrefix "!"
